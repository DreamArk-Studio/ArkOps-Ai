# ArkOps-Ai 配置文件

# 语言设置 (en, zh)
language: "zh"

# OpenAI 兼容 API 配置
# 支持所有兼容 OpenAI 接口的服务:
#   - OpenAI: api-url: "https://api.openai.com/v1/chat/completions"
#   - DeepSeek: api-url: "https://api.deepseek.com/chat/completions"
#   - 阿里云百炼: api-url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
#   - 其他兼容 OpenAI 接口的服务
openai:
  # API Key
  api-key: "YOUR_API_KEY_HERE"
  # 使用的模型名称
  model: "qwen3.5-plus"
  # API 请求地址
  api-url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  # API 超时时间 (秒)
  timeout: 60
  # 最大响应 token 数
  max-tokens: 2000
  # 温度参数 (创造性, 0-2)
  temperature: 1.0

# 频率限制配置
rate-limit:
  # 是否启用频率限制
  enabled: true
  # 时间窗口 (秒)
  window-seconds: 60
  # 普通玩家 (PLAYER) 在时间窗口内的最大请求次数
  max-requests-player: 5
  # 管理员 (ADMIN) 在时间窗口内的最大请求次数 (0 表示不限制)
  max-requests-admin: 0
  # 超级管理员 (SUPER_ADMIN) 在时间窗口内的最大请求次数 (0 表示不限制)
  max-requests-super-admin: 0
  # 控制台 (CONSOLE) 在时间窗口内的最大请求次数 (0 表示不限制)
  max-requests-console: 0

# 上下文配置
context:
  # 是否启用上下文功能
  enabled: true
  # 每个玩家的上下文消息数量（默认 5 条）
  max-messages-per-player: 5

# AI Agent 配置
agent:
  # 最大迭代次数（AI 调用工具的轮次上限，防止无限循环）
  max-iterations: 10

# 聊天触发器配置
chat-trigger:
  # 是否启用聊天触发器功能（在聊天中使用 @ops 触发 AI 对话）
  enabled: true
  # 触发词（默认 @ops）
  trigger: "@ops"
