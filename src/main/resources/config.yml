# ArkOps-Ai Configuration File

# Language setting (en, zh)
language: "en"

# OpenAI API Configuration
openai:
  # OpenAI API Key
  api-key: "YOUR_API_KEY_HERE"
  # Model to use
  model: "gpt-5.4"
  # API timeout (seconds)
  timeout: 60
  # Max response tokens
  max-tokens: 2000
  # Temperature (creativity, 0-1)
  temperature: 0.7
