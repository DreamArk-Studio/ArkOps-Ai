name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload to GitHub Packages
        run: |
          echo "Uploading to GitHub Packages..."
          
          # 使用 GitHub API 上传
          curl -v -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/java-archive" \
            --data-binary @target/ArkOps-Ai-2.2.1.jar \
            "https://maven.pkg.github.com/DreamArk-Studio/ArkOps-Ai/com/arkops/ArkOps-Ai/2.2.1/ArkOps-Ai-2.2.1.jar" 2>&1 | tee upload.log
          
          # 检查上传结果
          if grep -q "201 Created\|200 OK" upload.log; then
            echo "✅ Upload successful!"
          else
            echo "❌ Upload failed. Check upload.log for details."
            cat upload.log
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
