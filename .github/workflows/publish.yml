name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Get Version from POM
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION"

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: List built artifacts
        run: |
          echo "Built artifacts:"
          ls -la target/*.jar

      - name: Upload to GitHub Packages
        run: |
          echo "Uploading to GitHub Packages..."
          
          JAR_FILE=$(ls target/arkops-ai-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "JAR file not found!"
            ls -la target/
            exit 1
          fi
          
          echo "Found JAR: $JAR_FILE"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/java-archive" \
            --data-binary @$JAR_FILE \
            "https://maven.pkg.github.com/DreamArk-Studio/ArkOps-Ai/com/arkops/arkops-ai/${{ env.VERSION }}/arkops-ai-${{ env.VERSION }}.jar")
          
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "409" ]; then
            if [ "$HTTP_STATUS" = "409" ]; then
              echo "Package already exists (skipped)"
            else
              echo "Upload to GitHub Packages successful!"
            fi
          else
            echo "Upload failed. HTTP Status: $HTTP_STATUS"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Release ID (Manual Trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v${{ env.VERSION }}")
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/DreamArk-Studio/ArkOps-Ai/releases/tags/$TAG_NAME" | jq -r '.id')
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to Release (Release Trigger)
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: target/arkops-ai-${{ env.VERSION }}.jar
          asset_name: arkops-ai-${{ env.VERSION }}.jar
          asset_content_type: application/java-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to Release (Manual Trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/java-archive" \
            --data-binary @target/arkops-ai-${{ env.VERSION }}.jar \
            "https://uploads.github.com/repos/DreamArk-Studio/ArkOps-Ai/releases/${{ env.RELEASE_ID }}/assets?name=arkops-ai-${{ env.VERSION }}.jar"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
