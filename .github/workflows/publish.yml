name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: List built artifacts
        run: |
          echo "Built artifacts:"
          ls -la target/*.jar

      - name: Upload to GitHub Packages
        run: |
          echo "Uploading to GitHub Packages..."
          
          # 查找 JAR 文件
          JAR_FILE=$(ls target/arkops-ai-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ JAR file not found!"
            ls -la target/
            exit 1
          fi
          
          echo "Found JAR: $JAR_FILE"
          
          # 使用 GitHub API 上传，直接获取 HTTP 状态码
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/java-archive" \
            --data-binary @$JAR_FILE \
            "https://maven.pkg.github.com/DreamArk-Studio/ArkOps-Ai/com/arkops/arkops-ai/2.2.1/arkops-ai-2.2.1.jar")
          
          echo "HTTP Status: $HTTP_STATUS"
          
          # 检查上传结果
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ Upload successful!"
          else
            echo "❌ Upload failed. HTTP Status: $HTTP_STATUS"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
