name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload JAR to GitHub Packages
        run: |
          echo "Uploading JAR file to GitHub Packages..."
          
          # 使用 curl 直接上传 JAR 文件
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/java-archive" \
            --upload-file target/ArkOps-Ai-2.2.0.jar \
            "https://maven.pkg.github.com/DreamArk-Studio/ArkOps-Ai/com/arkops/ArkOps-Ai/2.2.0/ArkOps-Ai-2.2.0.jar")
          
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ JAR file uploaded successfully!"
          else
            echo "❌ Failed to upload JAR file. HTTP Status: $HTTP_STATUS"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
