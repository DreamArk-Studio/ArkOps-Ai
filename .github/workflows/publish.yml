name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B -V

      - name: Publish to GitHub Packages
        run: |
          mvn deploy:deploy-file \
            -Dfile=target/ArkOps-Ai-2.2.0.jar \
            -DgroupId=com.arkops \
            -DartifactId=ArkOps-Ai \
            -Dversion=2.2.0 \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/DreamArk-Studio/ArkOps-Ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
